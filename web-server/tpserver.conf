# Default server configuration
#

server {
    listen 8443 ssl backlog=4096;
    listen [::]:8443 ssl backlog=4096;
    server_name localhost _;  # Add your local IP and a catch-all
    ssl_certificate /DATA/software/nginx.crt;
    ssl_certificate_key /DATA/software/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;

     location /trainingplanner {
        limit_req zone=one burst=50 nodelay;
        #add $uri/ to try_files(after $uri) for accessable subdirectories with an index file. Otherwise, 403 will happen for any subdirectory without one.
        try_files $uri /trainingplanner/scripts/url_parser.php?$query_string;

        location ~ \.php(/|$) {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;  # Or 127.0.0.1:9000 for TCP
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.ht {
            deny all;  # Block access to .htaccess files
        }
    }
}
